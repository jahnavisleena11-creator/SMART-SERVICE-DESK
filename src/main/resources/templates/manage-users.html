<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f7fb; }
        .table-panel { border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); overflow: hidden; }
        .table-panel .table { margin-bottom: 0; }
        .action-btns form { display: inline-block; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Manage Customers</h2>
            <p class="text-muted mb-0">Review registered customers and control account access.</p>
        </div>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/dashboard}">Back to Dashboard</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card table-panel">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'" th:text="${user.enabled ? 'Active' : 'Blocked'}"></span>
                    </td>
                    <td class="action-btns">
                        <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" class="me-2">
                            <button class="btn btn-sm btn-warning" type="submit" th:text="${user.enabled ? 'Block' : 'Unblock'}"></button>
                        </form>
                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post">
                            <button class="btn btn-sm btn-danger" type="submit">Remove User</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
