<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tickets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Service Ticket System</a>
        <div class="d-flex ms-auto">
            <a class="btn btn-outline-light" th:href="@{/logout}">Logout</a>
        </div>
    </div>
 </nav>

<div class="container py-4">
    <h2>My Tickets</h2>
    <div th:if="${success}" class="alert alert-success">Ticket created successfully.</div>
    <div class="table-responsive">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Priority</th>
            <th>Status</th>
            <th>SLA</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.id}"></td>
            <td><a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.title}"></a></td>
            <td th:text="${ticket.priority}"></td>
            <td>
                <span th:switch="${ticket.status}">
                    <span th:case="'OPEN'" class="badge bg-primary">Open</span>
                    <span th:case="'ASSIGNED'" class="badge bg-info">Assigned</span>
                    <span th:case="'IN_PROGRESS'" class="badge bg-info">In Progress</span>
                    <span th:case="'ON_HOLD'" class="badge bg-warning">On Hold</span>
                    <span th:case="'RESOLVED'" class="badge bg-success">Resolved</span>
                    <span th:case="'CLOSED'" class="badge bg-secondary">Closed</span>
                    <span th:case="*" class="badge bg-light text-dark" th:text="${ticket.status}"></span>
                </span>
            </td>
            <td>
                <span th:switch="${ticket.slaStatus}">
                    <span th:case="'ON_TIME'" class="badge bg-success">On Time</span>
                    <span th:case="'NEAR_BREACH'" class="badge bg-warning">Near Breach</span>
                    <span th:case="'BREACHED'" class="badge bg-danger">Breached</span>
                    <span th:case="*" class="badge bg-light text-dark" th:text="${ticket.slaStatus}"></span>
                </span>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
