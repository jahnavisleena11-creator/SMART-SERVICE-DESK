<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style> .badge-slab { font-size: .85rem; } </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Service Ticket System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/tickets/new}">Create Ticket</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tickets/my}">My Tickets</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tickets/list}">All Tickets</a></li>
            </ul>
            <div class="d-flex">
                <span class="navbar-text text-light me-3" th:text="${username}"></span>
                <a class="btn btn-outline-light" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </div>
 </nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2>Dashboard</h2>
            <p class="text-muted">Use the buttons below to manage tickets.</p>
        </div>
        <a class="btn btn-primary btn-lg" th:href="@{/tickets/new}">Create Ticket</a>
    </div>

    <div th:if="${summary != null}">
        <div class="row g-3 mt-3">
            <div class="col-sm-6 col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Total Tickets</h5>
                        <p class="card-text fs-4" th:text="${summary.totalTickets}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">Open</h5>
                        <p class="card-text fs-4" th:text="${summary.openTickets}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">Resolved</h5>
                        <p class="card-text fs-4" th:text="${summary.resolvedTickets}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="card text-white bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">Breached</h5>
                        <p class="card-text fs-4" th:text="${summary.slaBreachedTickets}">0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${summary == null}" class="mt-4">
        <p>Welcome, <strong th:text="${username}">User</strong>. Use the navigation to create or view tickets.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
