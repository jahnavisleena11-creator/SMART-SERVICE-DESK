<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Agent Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f7fb; }
        .panel { border: 0; border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Support Agent Portal</span>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/agent/dashboard}" sec:authorize="hasRole('SUPPORT_AGENT')">Assigned Tickets</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Assigned Tickets</h3>
            <p class="text-muted mb-0">Work the queue, update progress, and keep SLA commitments intact.</p>
        </div>
    </div>

    <div class="card panel">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Assigned Agent</th>
                    <th>SLA</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td><a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.id}"></a></td>
                    <td><a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.title}"></a></td>
                    <td th:text="${ticket.status}"></td>
                    <td>
                        <span class="badge" th:classappend="${ticket.assignedAgentName != null ? 'bg-primary' : 'bg-secondary'}" th:text="${ticket.assignedAgentName != null ? ticket.assignedAgentName : 'Unassigned'}"></span>
                    </td>
                    <td th:text="${ticket.remainingSlaText != null ? ticket.remainingSlaText : 'N/A'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
