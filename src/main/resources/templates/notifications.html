<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <h2>Notifications</h2>
    <div id="notificationList"></div>
</div>
<script>
fetch('/api/notifications').then(r=>r.json()).then(items=>{
  document.getElementById('notificationList').innerHTML = items.map(item => `<div class='alert alert-info'>${item.message}</div>`).join('');
});
</script>
</body>
</html>
