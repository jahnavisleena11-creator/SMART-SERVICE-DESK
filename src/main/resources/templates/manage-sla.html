<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage SLA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <h2>Manage SLA Policies</h2>
    <p class="text-muted">SLA policies are configured in the backend and can be extended with forms later.</p>
    <ul class="list-group">
        <li class="list-group-item" th:each="role : ${roles}" th:text="${role.name}"></li>
    </ul>
</div>
</body>
</html>
