<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Create Ticket</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        .required::after {
            content: "*";
            color: red;
            margin-left: 4px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/}">
            Service Ticket System
        </a>

        <div class="collapse navbar-collapse">

            <ul class="navbar-nav me-auto">

                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link" th:href="@{/tickets/new}">
                        Create Ticket
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link" th:href="@{/customer/dashboard}">
                        My Tickets
                    </a>
                </li>

            </ul>

            <div class="d-flex">
                <a class="btn btn-outline-light"
                   th:href="@{/logout}">
                    Logout
                </a>
            </div>

        </div>

    </div>
</nav>

<div class="container py-4">

    <h2>Create Ticket</h2>

    <form th:action="@{/tickets/new}"
          method="post"
          th:object="${ticketRequest}"
          class="needs-validation"
          novalidate>

        <div class="mb-3">
            <label class="form-label required">Title</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{title}"
                    required>

            <div class="invalid-feedback">
                Title is required.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label required">Description</label>

            <textarea
                    class="form-control"
                    rows="4"
                    th:field="*{description}"
                    required></textarea>

            <div class="invalid-feedback">
                Description is required.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label required">Priority</label>

            <select
                    class="form-select"
                    th:field="*{priority}"
                    required>

                <option value="">Select Priority</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>

            </select>

            <div class="invalid-feedback">
                Please select a priority.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label required">Category</label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{category}"
                    placeholder="Example: Hardware, Software, Network"
                    required>

            <div class="invalid-feedback">
                Category is required.
            </div>
        </div>

        <button type="submit"
                class="btn btn-primary">
            Create Ticket
        </button>

        <a th:href="@{/tickets/my}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
(() => {
    'use strict';

    const forms = document.querySelectorAll('.needs-validation');

    Array.from(forms).forEach(form => {

        form.addEventListener('submit', event => {

            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }

            form.classList.add('was-validated');

        }, false);

    });

})();
</script>

</body>
</html>
